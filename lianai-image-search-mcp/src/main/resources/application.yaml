spring:
  application:
    name: lianai-image-search-mcp-server
  profiles:
    active: stdio
server:
  port: 8127

# Pexels API Key：
# 1) 本地开发把真实 key 写在 application-local.yaml（已被 .gitignore 忽略），并以 local profile 启动；
# 2) 部署时用环境变量 PEXELS_API_KEY 注入；
# 3) 两者都没有时解析为空串，应用照样能启动（调用工具时会返回明确的错误信息），
#    避免启动/打包阶段因 "Could not resolve placeholder 'pexels.api-key'" 直接失败。
pexels:
  api-key: "${PEXELS_API_KEY:}"

